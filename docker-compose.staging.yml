# docker-compose.staging.yml
services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      - "3000:3000"               # backend accessible sur localhost:3000
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-portfolio-realm}
      - NODE_ENV=staging
    depends_on:
      - postgres
      - keycloak

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-sonarqube-db.sh:/docker-entrypoint-initdb.d/init-sonarqube-db.sh
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HOSTNAME_STRICT=false
    command: start-dev

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  sonarqube:
    image: sonarqube:10-community
    container_name: portfolio_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=${DB_USER:-postgres}
      - SONAR_JDBC_PASSWORD=${DB_PASSWORD:-secret}
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - sonar.search.javaAdditionalOpts=-Dcluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - postgres

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: portfolio_zap
    restart: unless-stopped
    command: zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"
    volumes:
      - /tmp/zap:/zap/wrk

  trivy:
    image: aquasec/trivy:latest
    container_name: portfolio_trivy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reports/trivy:/reports
    command: >
      image --format json
      --output /reports/trivy-report.json
      --severity HIGH,CRITICAL
      frontend:latest


  # ── PROMETHEUS 
  prometheus:
    image: prom/prometheus:latest
    container_name: portfolio_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # ── GRAFANA 
  grafana:
    image: grafana/grafana:latest
    container_name: portfolio_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  sonarqube_data:
  sonarqube_logs:
  prometheus_data:
  grafana_data:
