version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    env_file:
      - ./backend/.env

    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/portfolio_db
      - DB_HOST=postgres
      - DB_NAME=portfolio_db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - JWT_SECRET=4a54ff6a01e06771dcd751ac194b4f4570220bb7aae32e5767d7c7024b78fcdd66eddea957ab79b14bacc45ca748d58d43d555db227770d11d9ae14dd8a0d539
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:3000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=pheracoreplatfoms@gmail.com
      - SMTP_PASSWORD=mrxwflshpgezmzlr
      - ADMIN_EMAIL=adminsup747@gmail.com
      - ADMIN_PASSWORD=Pheracore_admin@1224
      - ADMIN_ACTION_SECRET=27a2c6fc766ef9cfe67046444eb2830d8bf08b51bb3401cbd0a76d50fb76a73d
    depends_on:
      - postgres
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npx nodemon server.js"

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=portfolio_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    command: start-dev

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_node_modules:
  backend_node_modules:
