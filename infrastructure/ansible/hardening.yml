---
- name: Durcissement commun VM1 et VM2
  hosts: all
  become: yes
  tasks:

    - name: Mise à jour du système
      apt:
        update_cache: yes
        upgrade: yes

    - name: Installation des outils de sécurité
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - auditd
          - rkhunter
        state: present

    - name: Configuration pare-feu — refus par défaut
      ufw:
        default: deny
        direction: incoming

    - name: Autoriser SSH
      ufw:
        rule: allow
        port: '22'

    - name: Activer le pare-feu
      ufw:
        state: enabled

    - name: Démarrer fail2ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started

    - name: Durcissement SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '{{ item.regexp }}'
        line: '{{ item.line }}'
      loop:
        - { regexp: '^PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regexp: '^X11Forwarding', line: 'X11Forwarding no' }

    - name: Redémarrer SSH
      systemd:
        name: ssh
        state: restarted

    - name: Permissions fichiers sensibles
      file:
        path: '{{ item.path }}'
        mode: '{{ item.mode }}'
      loop:
        - { path: '/etc/ssh/sshd_config', mode: '0600' }
        - { path: '/etc/shadow', mode: '0640' }
        - { path: '/etc/passwd', mode: '0644' }

    - name: Paramètres noyau communs
      sysctl:
        name: '{{ item.name }}'
        value: '{{ item.value }}'
        sysctl_set: yes
      loop:
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'kernel.randomize_va_space', value: '2' }

    - name: Démarrer auditd
      systemd:
        name: auditd
        enabled: yes
        state: started

- name: Durcissement spécifique VM2
  hosts: vm2
  become: yes
  tasks:

    - name: Activer ip_forward pour Docker
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes

    - name: Ouvrir ports VM2
      ufw:
        rule: allow
        port: '{{ item }}'
      loop:
        - '80'
        - '443'
        - '8080'
        - '{{ grafana_port }}'  
        - '9090'
        - '3100'

    - name: Configurer le démon Docker
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "no-new-privileges": true,
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }

    - name: Redémarrer Docker
      systemd:
        name: docker
        state: restarted
