version: '3.8'
 
services:
  frontend:
    restart: always
    expose:
      - "80"
 
  backend:
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
 
  postgres:
    restart: always
 
  keycloak:
    restart: always
    expose:
      - "8080"
    command: start
 
  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"