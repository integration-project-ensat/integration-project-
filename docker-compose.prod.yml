version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  
    restart: always
    expose:
      - "80"
 
  backend:
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
 
  postgres:
    restart: always
 
  keycloak:
    restart: always
    expose:
      - "8080"
    environment:
      - KC_HOSTNAME=localhost        
      - KC_HOSTNAME_STRICT=false     
      - KC_HTTP_ENABLED=true         
      - KC_PROXY=edge                
    command: start
 
  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro