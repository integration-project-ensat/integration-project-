server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            tag: attrs.tag
      - regex:
          expression: (?P<container_name>[^|]+)\|(?P<image_name>[^|]+)
          source: tag
      - regex:
          expression: '^.*[-_](?P<service>[^-_]+)[-_][0-9]+$'
          source: container_name
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container: container_name
          service:
          image: image_name
      - output:
          source: output
