server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Assets statiques Vite (JS, CSS, images)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}