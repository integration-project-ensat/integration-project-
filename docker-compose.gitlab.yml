version: '3.8'
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: portfolio_gitlab
    restart: unless-stopped
    ports:
      - "9080:80"
      - "9443:443"
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://192.168.246.132:9080'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: '256m'

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data: