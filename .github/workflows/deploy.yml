name: CI/CD Pipeline

on:
  push:
    branches:
      - back

jobs:
  deploy:
    name: Deploy to VM2-DevSecOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/integration-app:$IMAGE_TAG .
          docker push $ECR_REGISTRY/integration-app:$IMAGE_TAG
          docker tag $ECR_REGISTRY/integration-app:$IMAGE_TAG $ECR_REGISTRY/integration-app:latest
          docker push $ECR_REGISTRY/integration-app:latest

      - name: Deploy to VM2 via Bastion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_HOST }} "cd /opt/app && docker pull ${{ secrets.ECR_REGISTRY }}/integration-app:latest && docker-compose -f docker-compose.prod.yml up -d --force-recreate"
