name: "Security Pipeline - Application Security"

on:
  push:
    branches:
      - main
      - dev
      - security    
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write

jobs:

  appsec-dependency-audit:
    name: "Audit des Dependances"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - run: mkdir -p security-reports

      - name: Audit Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=moderate \
          --json > ../security-reports/npm-audit-frontend.json || true

      - name: Audit Backend
        working-directory: ./backend
        run: |
          npm ci
          npm audit --audit-level=moderate \
          --json > ../security-reports/npm-audit-backend.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-dependances-${{ github.run_number }}
          path: security-reports/npm-audit-*.json
          retention-days: 30

  appsec-start-staging:
    name: "Demarrer Staging"
    runs-on: ubuntu-latest
    needs: appsec-dependency-audit
    outputs:
      sonar_token: ${{ steps.sonar_token.outputs.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Start staging
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            up -d --build

      - name: Wait for SonarQube
        run: |
          timeout 180 bash -c \
            'until curl -sf http://127.0.0.1:9000/api/system/status \
            | grep -q UP; do sleep 10; done'
          echo "SonarQube pret"

      - name: Generate Sonar Token
        id: sonar_token
        run: |
          TOKEN=$(curl -s -X POST \
            "http://127.0.0.1:9000/api/user_tokens/generate" \
            -u "admin:admin" \
            -d "name=pipeline-${{ github.run_number }}" \
            | grep -o '"token":"[^"]*"' \
            | cut -d'"' -f4)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Wait for Backend
        run: |
          timeout 60 bash -c \
            'until curl -sf http://127.0.0.1:3000; \
            do sleep 3; done'
          echo "Backend pret"

  appsec-sonarqube:
    name: "Analyse SonarQube"
    runs-on: ubuntu-latest
    needs: appsec-start-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ needs.appsec-start-staging.outputs.sonar_token }}
          SONAR_HOST_URL: "http://127.0.0.1:9000"

  appsec-secrets:
    name: "Detection Secrets Gitleaks"
    runs-on: ubuntu-latest
    needs: appsec-start-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appsec-dast-owasp-zap:
    name: "Scan DAST - OWASP ZAP"
    runs-on: ubuntu-latest
    needs:
      - appsec-sonarqube
      - appsec-secrets
    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP Scan
        run: |
          docker exec portfolio_zap \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r /zap/wrk/zap_report.html \
            -J /zap/wrk/zap_report.json \
            -I
          mkdir -p reports/zap
          docker cp portfolio_zap:/zap/wrk/zap_report.html reports/zap/
          docker cp portfolio_zap:/zap/wrk/zap_report.json reports/zap/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report-${{ github.run_number }}
          path: reports/zap/*
          retention-days: 30

  appsec-stop-staging:
    name: "Arreter Staging"
    runs-on: ubuntu-latest
    needs: appsec-dast-owasp-zap
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Stop staging
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            down --remove-orphans

  appsec-rapport:
    name: "Rapport AppSec Final"
    runs-on: ubuntu-latest
    needs:
      - appsec-dependency-audit
      - appsec-sonarqube
      - appsec-secrets
      - appsec-dast-owasp-zap
    if: always()
    steps:
      - name: Resume statuts
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          | Outil     | Statut                                          |
          |-----------|-------------------------------------------------|
          | npm audit | ${{ needs.appsec-dependency-audit.result }}     |
          | SonarQube | ${{ needs.appsec-sonarqube.result }}            |
          | Gitleaks  | ${{ needs.appsec-secrets.result }}              |
          | ZAP       | ${{ needs.appsec-dast-owasp-zap.result }}       |
          EOF