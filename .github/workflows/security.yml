name: Security Pipeline- Application Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: trivy fs .
  appsec-dependency-audit:
    name: "Audit des Dependances"
    runs-on: self-hosted
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: "Creer dossier rapports"
        run: mkdir -p security-reports

      - name: "Audit Frontend"
        working-directory: ./frontend
        run: |
          npm ci
          npm audit --audit-level=moderate --json > ../security-reports/npm-audit-frontend.json || true
          npm audit --audit-level=moderate || true

      - name: "Audit Backend"
        working-directory: ./backend
        run: |
          npm ci
          npm audit --audit-level=moderate --json > ../security-reports/npm-audit-backend.json || true
          npm audit --audit-level=moderate || true

      - name: "Publier rapports audit"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "audit-dependances-${{ github.run_number }}"
          path: security-reports/npm-audit-*.json
          retention-days: 30

  appsec-start-staging:
    name: "Demarrer Staging"
    runs-on: self-hosted
    needs: appsec-dependency-audit
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Demarrer staging"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            up -d --build

      - name: "Attendre SonarQube"
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:9000 > /dev/null; \
            do sleep 5; done'
          echo "SonarQube pret sur localhost:9000"

      - name: "Attendre Backend"
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:3000 > /dev/null; \
            do sleep 3; done'
          echo "Backend pret sur localhost:3000"

  appsec-sonarqube:
    name: "Analyse SonarQube"
    runs-on: self-hosted
    needs: appsec-start-staging
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "SonarQube Scan"
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"

  appsec-secrets:
    name: "Detection Secrets Gitleaks"
    runs-on: self-hosted
    needs: appsec-start-staging
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  appsec-dast-owasp-zap:
    name: "Scan DAST - OWASP ZAP"
    runs-on: self-hosted
    needs:
      - appsec-sonarqube
      - appsec-secrets
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Scanner avec ZAP"
        run: |
          docker exec portfolio_zap \
            zap-baseline.py \
            -t http://localhost:3000 \
            -r /zap/wrk/zap_report.html \
            -J /zap/wrk/zap_report.json \
            -I

      - name: "Publier rapport ZAP"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "zap-dast-report-${{ github.run_number }}"
          path: |
            ./reports/zap/zap_report.html
            ./reports/zap/zap_report.json
          retention-days: 30

  appsec-stop-staging:
    name: "Arreter Staging"
    runs-on: self-hosted
    needs: appsec-dast-owasp-zap
    if: always()
    steps:
      - name: "Arreter staging"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            down || true

  appsec-rapport:
    name: "Rapport AppSec Final"
    runs-on: ubuntu-latest
    needs:
      - security-scan
      - appsec-dependency-audit
      - appsec-sonarqube
      - appsec-secrets
      - appsec-dast-owasp-zap
    if: always()
    steps:
      - name: "Resume statuts"
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          | Outil     | Statut                                          |
          |-----------|-------------------------------------------------|
          | Trivy     | ${{ needs.security-scan.result }}               |
          | npm audit | ${{ needs.appsec-dependency-audit.result }}     |
          | SonarQube | ${{ needs.appsec-sonarqube.result }}            |
          | Gitleaks  | ${{ needs.appsec-secrets.result }}              |
          | ZAP       | ${{ needs.appsec-dast-owasp-zap.result }}       |
          EOF