name:  CI/CD Pipeline - Portfolio ENSA DevSecOps

on:
  push:
    branches:
      - main          # → déploiement PRODUCTION
      - develop       # → déploiement STAGING
      - 'feature/**'  # → CI uniquement (lint + tests)
      - 'fix/**'      # → CI uniquement (lint + tests)
  pull_request:
    branches:
      - main
      - develop

# ─────────────────────────────────────────────
#  Variables globales
# ─────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  POSTGRES_DB: portfolio_db
  POSTGRES_USER: portfolio_user
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ${{ github.repository }}/frontend
  IMAGE_BACKEND: ${{ github.repository }}/backend

# ─────────────────────────────────────────────
#  JOB 1 — LINT & QUALITÉ DU CODE
# ─────────────────────────────────────────────
jobs:
  lint:
    name:  Lint & Code Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Frontend (Vue.js) ──
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend (ESLint)
        working-directory: ./frontend
        run: npm run lint

      # ── Backend (Express.js) ──
      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Lint backend (ESLint)
        working-directory: ./backend
        run: npm run lint

# ─────────────────────────────────────────────
#  JOB 2 — TESTS UNITAIRES & INTÉGRATION
# ─────────────────────────────────────────────
  tests:
    name:  Tests Unitaires & Intégration
    runs-on: ubuntu-22.04
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Tests Backend (Jest / Mocha / Chai) ──
      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Run migrations (test DB)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          NODE_ENV: test
        run: npm run migrate

      - name: Run backend unit tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run test:unit -- --coverage

      - name: Run backend integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run test:integration

      # ── Tests Frontend (Vitest / Jest) ──
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test:unit -- --coverage

      # ── Upload coverage reports ──
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

# ─────────────────────────────────────────────
#  JOB 3 — ANALYSE SONARQUBE (SAST)
# ─────────────────────────────────────────────
  sonarqube:
    name:  SonarQube - Analyse statique
    runs-on: ubuntu-22.04
    needs: tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nécessaire pour SonarQube (blame info)

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=portfolio-ensa
            -Dsonar.projectName=Portfolio ENSA
            -Dsonar.sources=frontend/src,backend/src
            -Dsonar.tests=frontend/tests,backend/tests
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
            -Dsonar.qualitygate.wait=true

# ─────────────────────────────────────────────
#  JOB 4 — BUILD & PUSH IMAGES DOCKER
# ─────────────────────────────────────────────
  build:
    name:  Build Docker Images
    runs-on: ubuntu-22.04
    needs: tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    outputs:
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      image-tag: ${{ steps.get-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get image tag
        id: get-tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "tag=prod-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "tag=staging-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      # ── Docker Metadata Frontend ──
      - name: Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=${{ steps.get-tag.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Docker Metadata Backend ──
      - name: Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=${{ steps.get-tag.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Build & Push Frontend ──
      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      # ── Build & Push Backend ──
      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────
#  JOB 5 — SCAN SÉCURITÉ TRIVY (images Docker)
# ─────────────────────────────────────────────
  trivy:
    name:  Trivy - Scan vulnérabilités images
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Scan Frontend ──
      - name: Trivy scan - Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        continue-on-error: true

      # ── Scan Backend ──
      - name: Trivy scan - Backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        continue-on-error: true

      # ── Scan filesystem (dépendances npm) ──
      - name: Trivy scan - Filesystem (npm deps)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            trivy-frontend.sarif
            trivy-backend.sarif
            trivy-fs.sarif

# ─────────────────────────────────────────────
#  JOB 6 — DÉPLOIEMENT STAGING
# ─────────────────────────────────────────────
  deploy-staging:
    name:  Deploy → STAGING
    runs-on: ubuntu-22.04
    needs: [build, trivy, sonarqube]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -e
            echo "===  Déploiement STAGING ==="
            cd /opt/portfolio-app

            # Pull dernières images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG=${{ needs.build.outputs.image-tag }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export KEYCLOAK_SECRET=${{ secrets.KEYCLOAK_SECRET }}

            # Déploiement avec docker-compose
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d --remove-orphans

            # Attendre que les services soient healthy
            echo " Attente des services..."
            sleep 15
            docker-compose -f docker-compose.staging.yml ps

            # Migrations DB
            docker-compose -f docker-compose.staging.yml exec -T backend npm run migrate
            echo " Déploiement STAGING terminé"

# ─────────────────────────────────────────────
#  JOB 7 — TESTS E2E SUR STAGING (Cypress)
# ─────────────────────────────────────────────
  e2e-staging:
    name:  Tests E2E Cypress (Staging)
    runs-on: ubuntu-22.04
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Cypress deps
        working-directory: ./frontend
        run: npm ci

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          config: baseUrl=${{ vars.STAGING_URL }}
          browser: chrome
          headless: true
        env:
          CYPRESS_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          CYPRESS_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          CYPRESS_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          CYPRESS_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          CYPRESS_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          CYPRESS_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload Cypress screenshots (si échec)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          retention-days: 5

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos/
          retention-days: 5

# ─────────────────────────────────────────────
#  JOB 8 — SCAN OWASP ZAP (DAST) sur STAGING
# ─────────────────────────────────────────────
  owasp-zap:
    name:  OWASP ZAP - Scan DAST
    runs-on: ubuntu-22.04
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          issue_title: 'OWASP ZAP Vulnerability Report'
          fail_action: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 14

# ─────────────────────────────────────────────
#  JOB 9 — DÉPLOIEMENT PRODUCTION (main only)
# ─────────────────────────────────────────────
  deploy-production:
    name:  Deploy → PRODUCTION
    runs-on: ubuntu-22.04
    needs: [build, trivy, sonarqube]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            set -e
            echo "=== Déploiement PRODUCTION ==="
            cd /opt/portfolio-app

            # Backup DB avant déploiement
            echo " Backup PostgreSQL..."
            docker exec portfolio-postgres pg_dump -U ${{ env.POSTGRES_USER }} ${{ env.POSTGRES_DB }} \
              > /backups/backup-$(date +%Y%m%d-%H%M%S).sql

            # Pull images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG=${{ needs.build.outputs.image-tag }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export KEYCLOAK_SECRET=${{ secrets.KEYCLOAK_SECRET }}

            # Déploiement PROD (rolling update)
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # Attente services
            echo " Attente des services PROD..."
            sleep 20
            docker-compose -f docker-compose.prod.yml ps

            # Migrations DB
            docker-compose -f docker-compose.prod.yml exec -T backend npm run migrate

            # Nettoyage anciennes images
            docker image prune -f --filter "until=48h"

            echo "Déploiement PRODUCTION terminé - Tag: $IMAGE_TAG"

# ─────────────────────────────────────────────
#  JOB 10 — HEALTH CHECK POST-DÉPLOIEMENT
# ─────────────────────────────────────────────
  health-check:
    name:  Health Check Post-Déploiement
    runs-on: ubuntu-22.04
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Health check API backend
        run: |
          echo " Vérification du backend..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.PRODUCTION_URL }}/api/health)
            if [ "$STATUS" == "200" ]; then
              echo " Backend opérationnel (HTTP 200)"
              exit 0
            fi
            echo "Tentative $i/10 - Status: $STATUS"
            sleep 10
          done
          echo " Backend non disponible après 10 tentatives"
          exit 1

      - name: Health check frontend
        run: |
          echo " Vérification du frontend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.PRODUCTION_URL }})
          if [ "$STATUS" == "200" ]; then
            echo " Frontend opérationnel (HTTP 200)"
          else
            echo " Frontend non disponible - Status: $STATUS"
            exit 1
          fi

      - name: Health check Keycloak SSO
        run: |
          echo " Vérification Keycloak..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.PRODUCTION_URL }}/auth/realms/portfolio)
          if [ "$STATUS" == "200" ]; then
            echo " Keycloak opérationnel"
          else
            echo " Keycloak - Status: $STATUS"
          fi

# ─────────────────────────────────────────────
#  JOB 11 — NOTIFICATION (Succès / Échec)
# ─────────────────────────────────────────────
  notify:
    name:  Notification Pipeline
    runs-on: ubuntu-22.04
    needs:
      - lint
      - tests
      - sonarqube
      - build
      - trivy
      - deploy-staging
      - deploy-production
      - health-check
    if: always()

    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "status= ÉCHEC" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "status= ANNULÉ" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status= SUCCÈS" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.status }} Pipeline Portfolio ENSA",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "fields": [
                    { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit", "value": "${{ github.sha }}", "short": true },
                    { "title": "Auteur", "value": "${{ github.actor }}", "short": true },
                    { "title": "Message", "value": "${{ github.event.head_commit.message }}", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK