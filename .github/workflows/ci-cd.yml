name: CI/CD Pipeline

on:
  push:
    branches:
      - back

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/integration-frontend:latest ./frontend -f ./frontend/dockerfile
          docker push $ECR_REGISTRY/integration-frontend:latest

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/integration-backend:latest ./backend -f ./backend/dockerfile
          docker push $ECR_REGISTRY/integration-backend:latest

      - name: Build and push ai-service
        run: |
          docker build -t $ECR_REGISTRY/integration-ai:latest ./ai-service
          docker push $ECR_REGISTRY/integration-ai:latest

  deploy:
    name: Deploy to VM2-DevSecOps
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via Bastion SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.PROD_HOST }} << 'ENDSSH'
              cd /opt/app
              aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
              docker pull ${{ secrets.ECR_REGISTRY }}/integration-frontend:latest
              docker pull ${{ secrets.ECR_REGISTRY }}/integration-backend:latest
              docker pull ${{ secrets.ECR_REGISTRY }}/integration-ai:latest
              docker-compose -f docker-compose.prod.yml up -d --force-recreate
            ENDSSH
