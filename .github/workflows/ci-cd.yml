name: CI/CD Pipeline

on:
  push:
    branches:
      - back
      - main
      - dev

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ─── Job 0 : Tests (bloque le déploiement si les tests échouent) ──────────
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests (Vitest)
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests (Playwright)
        run: npx playwright test

  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/integration-frontend:latest ./frontend -f ./frontend/dockerfile
          docker push $ECR_REGISTRY/integration-frontend:latest

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/integration-backend:latest ./backend -f ./backend/dockerfile
          docker push $ECR_REGISTRY/integration-backend:latest

      - name: Build and push ai-service
        run: |
          docker build -t $ECR_REGISTRY/integration-ai:latest ./ai-service
          docker push $ECR_REGISTRY/integration-ai:latest

  deploy:
    name: Deploy to VM1 directly
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy directly to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}  # This should now be the EC2 public IP
          username: ubuntu  # e.g., ubuntu, ec2-user, admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-west-1 | sudo docker login --username AWS --password-stdin 893596490613.dkr.ecr.eu-west-1.amazonaws.com
            cd /opt/app
            sudo docker-compose -f docker-compose.prod.yml down
            sudo ECR_REGISTRY=893596490613.dkr.ecr.eu-west-1.amazonaws.com docker-compose -f docker-compose.prod.yml pull
            sudo ECR_REGISTRY=893596490613.dkr.ecr.eu-west-1.amazonaws.com docker-compose -f docker-compose.prod.yml up -d
